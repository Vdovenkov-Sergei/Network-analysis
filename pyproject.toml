[tool.poetry]
name = "network-analysis"
version = "0.2.0"
description = "Head Hunter salary prediction using regression models"
authors = ["Vdovenkov Sergei <vdovenkov2000@gmail.com>"]
readme = "README.md"
packages = [
    {include = "parsers"},
    {include = "utils"},
    {include = "config"},
    {include = "training"},
]
include = ["preprocess.py", "train.py"]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pandas = "^2.1.0"
numpy = "^1.24.0"
scikit-learn = "^1.3.0"
requests = "^2.31.0"
typing-extensions = "^4.7.1"
matplotlib = "^3.7.0"
rich = "^14.3.1"

[tool.poetry.group.dev.dependencies]
mypy = "^1.5.0"
ruff = "^0.1.0"
isort = "^5.12.0"
black = "^23.9.0"
jupyter = "^1.0.0"
ipykernel = "^6.25.0"
pandas-stubs = "^2.1.0"
types-requests = "^2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N802", "N803", "N806", "UP007"]
